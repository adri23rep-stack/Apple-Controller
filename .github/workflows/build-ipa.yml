name: Hydra LG iOS - IPA independiente
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hydra-ios-test

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout de la rama experimental
        uses: actions/checkout@v4
      - name: Extraer catálogo original de Hydra LG
        run: python3 scripts/prepare-resources.py
      - name: Validar datos antes de compilar
        run: |
          python3 - <<'PY'
          import json
          with open('ios/Resources/hydra-catalog.json', encoding='utf-8') as f:
              data=json.load(f)
          assert len(data['items']) == 610
          assert data['generatedAt'].startswith('2026-10-27')
          print('LG snapshot OK:', len(data['items']))
          PY
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto SwiftUI
        run: xcodegen generate
      - name: Compilar IPA para iPhone
        run: |
          xcodebuild -project HydraIOS.xcodeproj -scheme HydraIOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build
      - name: Compilar y abrir en simulador de iPhone (diagnóstico)
        continue-on-error: true
        run: |
          set -euo pipefail
          xcodebuild -project HydraIOS.xcodeproj -scheme HydraIOS \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .sim CODE_SIGNING_ALLOWED=NO build
          SIM_ID=$(xcrun simctl list -j devices available | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"]; phones=[d["udid"] for items in groups.values() for d in items if d["name"].startswith("iPhone") and d["state"]=="Shutdown"]; print(phones[0] if phones else "")')
          test -n "$SIM_ID" || { echo "No hay simulador iPhone disponible"; exit 1; }
          echo "Probando arranque en simulador: $SIM_ID"
          echo "ID de la app del simulador:"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' .sim/Build/Products/Debug-iphonesimulator/HydraIOS.app/Info.plist
          # Simulator requires a locally valid bundle. Sign the simulator binary ad hoc;
          # the iPhone IPA remains unsigned for SideStore to sign.
          codesign --force --deep --sign - --timestamp=none .sim/Build/Products/Debug-iphonesimulator/HydraIOS.app
          codesign --verify --deep --strict --verbose=2 .sim/Build/Products/Debug-iphonesimulator/HydraIOS.app
          xcrun simctl erase "$SIM_ID" || true
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          if ! xcrun simctl install "$SIM_ID" .sim/Build/Products/Debug-iphonesimulator/HydraIOS.app; then
            echo "El simulador no pudo instalar la app. El error puede ser de la imagen de macOS del runner."
            xcrun simctl list devices
            exit 1
          fi
          xcrun simctl launch "$SIM_ID" dev.diamondk.hydracheck
          sleep 5
          xcrun simctl io "$SIM_ID" screenshot --type=png Hydra-ios-simulator.png
          test -s Hydra-ios-simulator.png
          echo "Simulador: app instalada, iniciada y captura tomada."
      - name: Captura de prueba del simulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HydraIOS-simulador
          path: Hydra-ios-simulator.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Empaquetar IPA sin firmar
        run: |
          mkdir -p Payload
          test -d .build/Build/Products/Release-iphoneos/HydraIOS.app
          cp -R .build/Build/Products/Release-iphoneos/HydraIOS.app Payload/
          zip -qry HydraIOS-LG-Catalogo-Standalone-unsigned.ipa Payload
          unzip -p HydraIOS-LG-Catalogo-Standalone-unsigned.ipa Payload/HydraIOS.app/Resources/hydra-catalog.json | python3 -c 'import json,sys; x=json.load(sys.stdin); assert len(x["items"])==610; print("IPA validada: 610 registros originales Hydra")'
          unzip -p HydraIOS-LG-Catalogo-Standalone-unsigned.ipa Payload/HydraIOS.app/Info.plist > /tmp/hydra_ipa_Info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' /tmp/hydra_ipa_Info.plist | grep -Fx "dev.diamondk.hydracheck"
          /usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' /tmp/hydra_ipa_Info.plist | grep -Fx "HydraIOS"
      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: HydraIOS-LG-Catalogo-Standalone
          path: HydraIOS-LG-Catalogo-Standalone-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
