name: HydraIOS
options:
  bundleIdPrefix: dev.diamondk
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HydraIOS:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
      - path: ios/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.diamondk.hydraios.test
        INFOPLIST_FILE: ios/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: HydraIOS
