name: AppleController
options:
  bundleIdPrefix: com.adri23rep
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  AppleController:
    type: application
    platform: iOS
    sources:
      - path: AppleController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adri23rep.applecontroller
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    info:
      path: AppleController/Info.plist
      properties:
        CFBundleDisplayName: Apple Controller
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        NSLocalNetworkUsageDescription: "Apple Controller se conecta a tu PC por Wi-Fi para controlar Xuper TV."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
